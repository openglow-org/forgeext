name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout forgefirm (the image's deny rules, which the network allowlist is tested against)
        uses: actions/checkout@v4
        with:
          repository: openglow-org/forgefirm
          path: forgefirm-rules
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjansson-dev libarchive-dev libsodium-dev nftables
      - name: fwup 1.16.0 (the version the image carries)
        run: |
          curl -fsSL -o /tmp/fwup.deb https://github.com/fwup-home/fwup/releases/download/v1.16.0/fwup_1.16.0_amd64.deb
          sudo dpkg -i /tmp/fwup.deb
          fwup --version
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: caps_test (the closed capability list)
        run: ./build/caps_test
      - name: manifest_test (the manifest parser, and each way of being wrong)
        run: ./build/manifest_test
      - name: state_test (state.json, the account pool, a file this daemon did not write)
        run: ./build/state_test
      - name: super_test (the supervisor's policy over fake operations)
        run: ./build/super_test
      - name: holdkeep_test (what the host says for a package's hold, and how it keeps the files fresh)
        run: ./build/holdkeep_test
      - name: sandbox_test (a real child under the launcher, seen from inside and from outside)
        run: |
          # 77 is the test's "could not run here": on this runner that is a failure.
          sudo ./build/sandbox_test
      - name: netrules_test (net-check, net-allow, net-revoke against the image's rule file, with a peer namespace)
        run: |
          sudo FORGEEXT=build/forgeext FFX_RULES=forgefirm-rules/meta-forgefirm/recipes-forgefirm/forgefirm-sandbox/files/ffx.nft \
            python3 -B tests/netrules_test.py
      - name: run_test (the daemon itself: a stand-in forgectrl, four real packages, the armed window, quarantine, one daemon at a time, the sweep after a killed one, safe mode)
        run: |
          sudo FORGEEXT=build/forgeext FWUP="$(command -v fwup)" \
            FFX_RULES=forgefirm-rules/meta-forgefirm/recipes-forgefirm/forgefirm-sandbox/files/ffx.nft \
            python3 -B tests/run_test.py
      - name: install_test (the built binary against real archives, hostile ones included)
        run: |
          # 77 is the script's "could not run here": on this runner that is a failure.
          python3 -B tests/install_test.py
